name: GitHub-Actions-AWS

on:
  push:
    branches: [ main ]

permissions:
  id-token: write               # exposes the OIDC token endpoint — required
  contents: read

concurrency:                    # coalesce rapid pushes; never two publishes at once
  group: GitHub-Actions-AWS
  cancel-in-progress: false     # let an in-flight publish finish, then run latest

jobs:
  GitHub-Actions-AWS-job:
    runs-on: ubuntu-latest
    container:                  # deps prebaked; see Phase 3 note
      image: debian:trixie
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
      AWS_BUCKET_PREFIX: ${{ vars.AWS_BUCKET_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: build
        run: |
          ./builder
      - name: publish
        run: |
          gha-aws upload-to-s3
